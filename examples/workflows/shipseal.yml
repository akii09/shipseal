# Generate Shipseal release visuals automatically.
# See https://shipseal.dev/docs/github-action for all options.
name: Shipseal
on:
  release:
    types: [published]
permissions:
  contents: write   # required for uploading release assets
jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # required for release history and tags
      - uses: akii09/shipseal@v0.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
