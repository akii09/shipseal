# Dogfood: generate Shipseal cards for this repo's own releases.
name: Shipseal
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./
        with:
          version: workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
