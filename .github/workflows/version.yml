# Open a "Version Packages" pull request when changesets land on main.
# This workflow does NOT publish. Publishing happens in publish.yml, triggered by a
# GitHub release, so npm's trusted publisher stays bound to one workflow filename.
# Docs checked 2026-09-11: changesets/action@v2
name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write # commit the version bump to the release branch
  pull-requests: write # open and update the version PR
  statuses: write # report the required check on the version branch, see below

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets reads history to work out what changed

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # No publish-script, so this job only opens the version pull request.
          # Tags and releases stay manual: creating the GitHub release is the human
          # decision that triggers publish.yml, and both default to true.
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch protection on main requires the "check" status, but GitHub deliberately does
      # not trigger workflows for commits pushed with GITHUB_TOKEN, so CI never runs on the
      # version branch and its pull request is blocked forever. The alternative fix is a
      # personal access token, which reintroduces the long-lived credential that trusted
      # publishing removed. Instead, run the same gates here and report the status ourselves.
      #
      # This is honest: the version commit only rewrites package.json, CHANGELOG.md and the
      # consumed changeset files, and these gates run against the versioned branch.
      - name: Verify and report the required check
        # No `if` on the action's outputs: the output name differs between "created" and
        # "updated" runs, and guessing it silently skipped this step. Check for the branch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin changeset-release/main >/dev/null; then
            echo "No version branch, nothing to verify."
            exit 0
          fi
          git fetch origin changeset-release/main
          # Verify in a linked worktree, not in this one.
          #
          # `changeset version` leaves packages/shipseal/package.json and CHANGELOG.md modified
          # here, so checking the pushed branch out in place fails with "your local changes would
          # be overwritten by checkout", and forcing it would mean a destructive git command in a
          # shared step. A worktree gives a clean checkout of exactly what was pushed, shares the
          # objects and tags this clone already fetched (check:action-ref needs those tags), and
          # leaves this tree alone.
          #
          # It also fixes what the old `checkout -B` was working around: the status is reported
          # for the worktree's HEAD, which is the commit that was actually verified, so it lands
          # on the pull request head rather than on main.
          VERIFY="$RUNNER_TEMP/verify"
          git worktree add --detach "$VERIFY" origin/changeset-release/main
          cd "$VERIFY"
          pnpm install --frozen-lockfile
          STATE=success
          pnpm lint && pnpm check:action-ref && pnpm typecheck && pnpm test && pnpm build || STATE=failure
          SHA="$(git rev-parse HEAD)"
          echo "Reporting check for $SHA"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context=check \
            -f description="Gates run by the version workflow" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$STATE" == "success" ]]
