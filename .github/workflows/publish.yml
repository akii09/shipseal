# Publish `shipseal` to npm with trusted publishing (OIDC). No NPM_TOKEN exists.
# Docs checked 2026-09-11: https://docs.npmjs.com/trusted-publishers/
#
# Before the first run, configure the trusted publisher on npmjs.com under the
# package's Settings, using the values in docs/RELEASING.md.
#
# Actions here are pinned to full commit SHAs, not tags. GitHub's secure-use guidance
# (checked 2026-09-12) calls a SHA "the only way to use an action as an immutable release",
# because a tag can be moved or deleted by anyone who gains access to the action's repository.
# This job holds the npm publishing identity over OIDC, so it is the one worth hardening first.
# Dependabot's github-actions ecosystem bumps these and keeps the trailing version comment.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required: lets the runner mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate the publish behind an environment so required reviewers can be added.
    # Provenance proves where a package was built, not that the source was reviewed.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Node 22 ships npm 10.x. Trusted publishing needs npm 11.5.1 or later.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # A release tag that disagrees with the manifest would publish the wrong
      # version under the right tag. Fail loudly instead.
      - name: Check tag matches package version
        if: github.event_name == 'release'
        working-directory: packages/shipseal
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [[ "$PKG" != "$TAG" ]]; then
            echo "::error::package.json version $PKG does not match release tag $TAG"
            exit 1
          fi

      - name: Verify tarball contents
        working-directory: packages/shipseal
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        working-directory: packages/shipseal
        run: npm publish
